name: Standalone checks
on: [push, pull_request, workflow_dispatch]
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: python -I -S -X utf8 skill/scripts/research_checks.py --input examples/teaching.json
      - run: python -X utf8 skill/scripts/check_report.py index.html
      - run: python -X utf8 skill/scripts/check_report.py skill/assets/dashboard-template.html
      - run: python -X utf8 skill/scripts/check_report.py skill/assets/report-template.html
      - run: python -X utf8 skill/scripts/check_report.py 油运行业状态仪表盘-20261014.html
      - run: python -X utf8 skill/scripts/check_report.py 油运行业数据拆解-20261014.html
